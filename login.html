<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect TikTok</title><link rel="stylesheet" href="style.css"></head><body>
<h1>Connect TikTok</h1>
<p>Owner only. Paste the app's <b>Client key</b> (Sandbox) and sign in with the Hollow Moon TikTok account.</p>
<p><input id="k" placeholder="Client key" style="width:100%;padding:8px;font:inherit"></p>
<p><button id="go" style="padding:10px 16px;font:inherit">Continue with TikTok</button></p>
<script>
const R="https://babstabst-dot.github.io/hollow-moon-legal/callback.html";
document.getElementById("go").onclick=()=>{const k=document.getElementById("k").value.trim();if(!k)return;
const st=Math.random().toString(36).slice(2);try{sessionStorage.setItem("tt_key",k);sessionStorage.setItem("tt_state",st);}catch(e){}
location.href="https://www.tiktok.com/v2/auth/authorize/?"+new URLSearchParams({client_key:k,scope:"user.info.basic,user.info.stats,video.upload,video.list",response_type:"code",redirect_uri:R,state:st});};
</script>
<p><a href="index.html">Home</a></p></body></html>
